[package]
name = "g90tui"
version = "0.0.1"
edition = "2021"
description = "G90TUI — gTUI artesanal de los 90 al estilo de la técnica CA-Clipper para Rust. Alternativa pastel, de una-llamada, a Ratatui."
homepage = "https://github.com/GcorpZ/G90TUI"
repository = "https://github.com/GcorpZ/G90TUI.git"
license = "MIT OR Apache-2.0"
authors = ["GcorpZ (Pedro Garcia Castillo)"]
keywords = ["tui", "terminal", "retro", "clipper", "pastel"]
categories = ["command-line-interface", "gui"]
rust-version = "1.75"

[lib]
name = "g90tui"
path = "src/lib.rs"

[dependencies]
crossterm = "0.28"
unicode-width = "0.1"

[dev-dependencies]

[features]
default = []
serde = []
